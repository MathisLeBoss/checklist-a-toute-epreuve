<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#2196F3">

  <meta name="description"
        content="Checklist à toute épreuve - Votre checklist personnelle accessible partout.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Checklist">

  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>Checklist à toute épreuve</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    body {
      -webkit-tap-highlight-color: transparent;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      font-family: Arial, sans-serif;
      transition: opacity 0.3s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #2196F3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 36px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(33, 150, 243, 0.25);
    }

    .loading-title {
      font-size: 22px;
      font-weight: 600;
      color: #222222;
      margin-bottom: 18px;
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e0e0e0;
      border-top-color: #2196F3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <!-- Écran de chargement -->
  <div id="loading">
    <div class="loading-icon">✓</div>
    <div class="loading-title">Checklist à toute épreuve</div>
    <div class="loading-spinner"></div>
  </div>

  <!-- Application Flutter -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        const loading = document.getElementById('loading');

        if (loading) {
          loading.classList.add('hidden');

          setTimeout(function () {
            loading.remove();
          }, 400);
        }
      }, 500);
    });
  </script>
<script>
  let deferredInstallPrompt = null;

  window.addEventListener('beforeinstallprompt', function (event) {
    event.preventDefault();
    deferredInstallPrompt = event;
  });

  window.installPWA = async function () {
    if (!deferredInstallPrompt) {
      alert(
        "L'installation n'est pas disponible pour le moment. " +
        "Vérifie que l'application est ouverte en HTTPS."
      );
      return;
    }

    deferredInstallPrompt.prompt();

    const result = await deferredInstallPrompt.userChoice;

    if (result.outcome === 'accepted') {
      console.log('Application installée');
    }

    deferredInstallPrompt = null;
  };
</script>

</body>
</html>
